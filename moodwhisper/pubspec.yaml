name: mood_whisper
description: "MoodWhisper - A privacy-first mood tracking app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0
  sqflite: ^2.3.3
  path: ^1.9.0
  shared_preferences: ^2.2.3
  fl_chart: ^0.68.0
  csv: ^6.0.0
  share_plus: ^9.0.0
  logger: ^2.3.0
  sentry_flutter: ^0.7.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
